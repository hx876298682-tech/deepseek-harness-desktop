name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist:mac-arm64
          - os: macos-13
            script: dist:mac-x64
          - os: ubuntu-24.04
            script: dist:linux
          - os: windows-2022
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set package version from tag
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npm run ${{ matrix.script }} -- --publish always
